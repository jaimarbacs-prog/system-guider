<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Guider — Smart Attendance Demo</title>
    <style>
      :root { font-family: Inter, system-ui, sans-serif; color: #10213b; background: #f4f7fb; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      .app { margin-left: 0; padding: 32px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
      .brand { font-size: 21px; font-weight: 800; }
      .brand span { color: #2563eb; }
      .help { padding: 10px 16px; border: 0; border-radius: 10px; color: white; background: #2563eb; cursor: pointer; }
      .grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; max-width: 980px; margin: auto; }
      .card { padding: 24px; border: 1px solid #e3e9f2; border-radius: 18px; background: white; box-shadow: 0 12px 30px rgba(15, 23, 42, .06); }
      h1 { margin: 0 0 8px; font-size: 28px; }
      .muted { color: #64748b; }
      .form { display: grid; gap: 16px; margin-top: 24px; }
      label { display: grid; gap: 7px; font-size: 13px; font-weight: 700; }
      input, select { width: 100%; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 10px; font: inherit; }
      .primary { padding: 12px 16px; border: 0; border-radius: 10px; color: white; background: #0f766e; font-weight: 750; cursor: pointer; }
      .metric { font-size: 34px; font-weight: 850; }
      .toast { position: fixed; right: 24px; bottom: 24px; display: none; padding: 12px 16px; border-radius: 10px; color: white; background: #0f766e; }
      @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } .app { padding: 18px; } }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand"><span>Smart</span> Attendance</div>
        <button id="help-guide" class="help">Open System Guider</button>
      </header>
      <section class="grid">
        <article class="card">
          <h1>Mark attendance</h1>
          <p class="muted">Record today's employee attendance.</p>
          <form id="attendance-form" class="form">
            <label>
              Attendance date
              <input data-guider="attendance-date" type="date" required />
            </label>
            <label>
              Employee
              <select data-guider="employee-select" required>
                <option value="">Select an employee</option>
                <option value="ana">Ana Santos</option>
                <option value="marco">Marco Reyes</option>
              </select>
            </label>
            <label>
              Status
              <select data-guider="attendance-status" required>
                <option value="present">Present</option>
                <option value="late">Late</option>
                <option value="absent">Absent</option>
              </select>
            </label>
            <button data-guider="submit-attendance" class="primary" type="submit">Save attendance</button>
          </form>
        </article>
        <aside class="card">
          <p class="muted">Present today</p>
          <div class="metric">87%</div>
          <p class="muted">Use the System Guider panel to record this form or play the included sample guide.</p>
          <button data-guider="mark-attendance-btn" id="play-sample" class="help">Play sample guide</button>
        </aside>
      </section>
    </main>
    <div id="toast" class="toast" role="status">Attendance saved</div>
    <script type="module" src="./demo.js"></script>
  </body>
</html>
